amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    tf_broadcast: true
    transform_tolerance: 0.3
    set_initial_pose: true
    initial_pose:
      x: 2.0
      y: 2.0
      z: 0.0
      yaw: 0.0
    min_particles: 300
    max_particles: 2000
    max_beams: 120
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 15.0
    laser_min_range: 0.05
    sigma_hit: 0.15
    z_hit: 0.8
    z_rand: 0.2
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    update_min_a: 0.0
    update_min_d: 0.0
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
