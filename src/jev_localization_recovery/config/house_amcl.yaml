amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: true
    initial_pose:
      x: 3.8
      y: 2.7
      z: 0.0
      yaw: 0.0
    min_particles: 500
    max_particles: 10000
    max_beams: 90
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.15
    z_hit: 0.95
    z_rand: 0.05
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    update_min_a: 0.05
    update_min_d: 0.05
    transform_tolerance: 0.5
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
